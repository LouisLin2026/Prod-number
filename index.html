<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>產品開發需求單取號系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF8;--surface:#fff;--border:#E8E5DF;--border-s:#C8C5BE;
  --text:#1A1A18;--muted:#6B6B68;--hint:#A8A8A5;
  --accent:#1F3864;--accent-l:#EEF2F8;--accent-t:#1F3864;
  --green:#2D5A3D;--green-l:#EAF2EC;
  --amber:#B8690A;--amber-l:#FEF3E2;
  --red:#C0392B;--red-l:#FBEAE8;
  --blue:#0369A1;--blue-l:#EFF8FF;
  --purple:#7C3AED;--purple-l:#F5F3FF;
  --radius:10px;--radius-s:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}

/* ── Header ── */
.header{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;user-select:none}
.h-left{display:flex;flex-direction:column;gap:2px}
.h-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
.h-sub{font-size:11px;opacity:.75;display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#fbbf24;flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:#4ade80}.sync-dot.err{background:#f87171}
.ai-dot{width:7px;height:7px;border-radius:50%;background:#a78bfa;flex-shrink:0;transition:all .3s}
.ai-dot.thinking{animation:ai-pulse 1s ease-in-out infinite}
.ai-dot.done{background:#4ade80}.ai-dot.err{background:#f87171}
@keyframes ai-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.menu-btn{width:36px;height:36px;border:none;background:rgba(255,255,255,.15);border-radius:var(--radius-s);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
.menu-btn span{display:block;width:18px;height:2px;background:#fff;border-radius:2px}

/* ── Nav ── */
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.nav-btn{flex:1;padding:10px 6px 8px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.admin-bar{background:var(--red-l);border-bottom:2px solid var(--red);padding:7px 16px;display:none;align-items:center;justify-content:space-between}
.admin-bar.show{display:flex}
.admin-bar-label{font-size:12px;font-weight:700;color:var(--red)}
.admin-exit{font-size:11px;padding:3px 10px;border:1px solid var(--red);border-radius:var(--radius-s);background:#fff;cursor:pointer;color:var(--red);font-family:inherit}

/* ── Content ── */
.content{padding:14px;max-width:480px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.req{color:var(--red);margin-left:2px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border-s);border-radius:var(--radius-s);font-family:inherit;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err-msg{color:var(--red);font-size:11px;margin-top:3px;display:none}
.preview-box{background:var(--accent-l);border:1px solid #C8D8F0;border-radius:var(--radius-s);padding:12px 14px;text-align:center;margin-bottom:12px}
.preview-num{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:2px;font-family:monospace}
.preview-label{font-size:11px;color:var(--muted);margin-top:3px}
.info-box{background:var(--amber-l);border:1px solid #E8C380;border-radius:var(--radius-s);padding:10px 12px;font-size:12px;color:#7A4500;margin-bottom:12px;line-height:1.65}
.btn-p{display:block;width:100%;padding:11px;border:none;border-radius:var(--radius-s);background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s}
.btn-p:hover{background:#162a4d}
.btn-p:disabled{background:#A8B4C4;cursor:not-allowed}
.btn-s{padding:7px 14px;border:1px solid var(--border-s);border-radius:var(--radius-s);background:#fff;cursor:pointer;color:var(--muted);font-family:inherit;font-size:12px}
.toast{background:var(--green-l);border:1px solid #9FC9AA;border-radius:var(--radius-s);padding:12px 14px;margin-bottom:12px;display:none}
.toast-num{font-size:22px;font-weight:700;color:var(--green);font-family:monospace;display:flex;align-items:center;gap:8px}
.toast-msg{font-size:12px;color:var(--green);margin-top:3px}
.copy-big-btn{font-size:12px;padding:4px 10px;border:1px solid var(--green);border-radius:var(--radius-s);background:#fff;cursor:pointer;color:var(--green);font-family:inherit;margin-left:auto;flex-shrink:0}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:8px;text-align:center}
.stat-v{font-size:20px;font-weight:700;color:var(--accent)}
.stat-l{font-size:10px;color:var(--muted)}
.history-table{width:100%;border-collapse:collapse;font-size:12px}
.history-table th{text-align:left;padding:7px 8px;border-bottom:2px solid var(--border-s);color:var(--muted);font-weight:600;font-size:11px}
.history-table td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.history-table tr:last-child td{border-bottom:none}
.num-badge{background:var(--accent-l);color:var(--accent);font-weight:700;padding:2px 7px;border-radius:4px;font-size:11px;font-family:monospace;white-space:nowrap;display:inline-block}
.cat-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;background:var(--blue-l);color:var(--blue);white-space:nowrap}
.copy-btn{font-size:10px;padding:2px 6px;border:1px solid var(--border-s);border-radius:4px;background:#fff;cursor:pointer;color:var(--muted);font-family:inherit;margin-left:4px;vertical-align:middle}
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-select{padding:5px 8px;border:1px solid var(--border-s);border-radius:var(--radius-s);font-family:inherit;font-size:12px;background:var(--surface);color:var(--text);outline:none}
.empty{text-align:center;padding:24px;color:var(--hint);font-size:13px}
.loading-box{text-align:center;padding:30px;color:var(--hint)}
.loading-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Menu overlay ── */
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-start;justify-content:flex-end}
.menu-overlay.open{display:flex}
.menu-panel{background:var(--surface);width:240px;min-height:100vh;padding:0;box-shadow:-4px 0 20px rgba(0,0,0,.15);display:flex;flex-direction:column}
.menu-header{background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.menu-header-title{font-size:14px;font-weight:700}
.menu-close{width:30px;height:30px;border:none;background:rgba(255,255,255,.2);border-radius:var(--radius-s);cursor:pointer;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.menu-body{padding:16px;flex:1}
.menu-section{margin-bottom:20px}
.menu-section-title{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--hint);text-transform:uppercase;margin-bottom:8px}
.menu-item{display:block;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--bg);font-family:inherit;font-size:13px;color:var(--text);cursor:pointer;text-align:left;margin-bottom:6px;transition:all .15s}
.menu-item:hover{background:var(--accent-l);border-color:var(--accent);color:var(--accent-t)}

/* ── PIN overlay ── */
.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.pin-overlay.open{display:flex}
.pin-box{background:var(--surface);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:300px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.pin-input{width:100%;padding:13px;text-align:center;font-size:24px;letter-spacing:.4em;border:1px solid var(--border-s);border-radius:var(--radius-s);font-family:inherit;background:var(--bg);color:var(--text);outline:none;margin-bottom:8px}
.pin-input:focus{border-color:var(--accent);background:#fff}
.pin-err{font-size:12px;color:var(--red);min-height:18px;margin-bottom:8px}
.pin-row{display:flex;gap:8px}
.pin-ok{flex:1;padding:10px;border:none;border-radius:var(--radius-s);background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.pin-cancel{padding:10px 16px;border:1px solid var(--border-s);border-radius:var(--radius-s);background:#fff;cursor:pointer;color:var(--muted);font-family:inherit;font-size:13px}

/* ══ 🐠 小福 AI 功能樣式 ══ */

/* 智能建議框 */
.ai-suggest-box{background:var(--purple-l);border:1px solid #DDD6FE;border-radius:var(--radius-s);padding:10px 12px;margin-top:6px;display:none}
.ai-suggest-box.show{display:block}
.ai-suggest-title{font-size:11px;font-weight:700;color:var(--purple);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.ai-suggest-chips{display:flex;gap:5px;flex-wrap:wrap}
.ai-suggest-chip{padding:4px 10px;border:1px solid #C4B5FD;border-radius:20px;background:#fff;cursor:pointer;font-family:inherit;font-size:12px;color:var(--purple);font-weight:500;transition:all .15s}
.ai-suggest-chip:hover{background:var(--purple);color:#fff;border-color:var(--purple)}
.ai-suggest-chip.selected{background:var(--purple);color:#fff;border-color:var(--purple)}

/* 重複偵測警告 */
.dup-warn-box{background:var(--amber-l);border:1px solid #E8C380;border-radius:var(--radius-s);padding:12px 14px;margin-bottom:12px;display:none}
.dup-warn-box.show{display:block}
.dup-warn-title{font-size:13px;font-weight:700;color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dup-item{background:#fff;border:1px solid #E8C380;border-radius:var(--radius-s);padding:8px 10px;margin-bottom:6px;font-size:12px}
.dup-item:last-child{margin-bottom:0}
.dup-num{font-family:monospace;font-weight:700;color:var(--accent);margin-right:6px}
.dup-score{font-size:10px;padding:1px 6px;border-radius:20px;background:var(--amber-l);color:var(--amber);font-weight:700;float:right}
.dup-actions{display:flex;gap:6px;margin-top:10px}
.dup-confirm-btn{flex:1;padding:7px;border:none;border-radius:var(--radius-s);background:var(--amber);color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.dup-cancel-btn{padding:7px 14px;border:1px solid var(--border-s);border-radius:var(--radius-s);background:#fff;cursor:pointer;color:var(--muted);font-family:inherit;font-size:12px}

/* AI 狀態列 */
.ai-status-bar{background:var(--purple-l);border:1px solid #DDD6FE;border-radius:var(--radius-s);padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--purple);display:none;align-items:center;gap:8px}
.ai-status-bar.show{display:flex}
.ai-spinner{width:13px;height:13px;border:2px solid #DDD6FE;border-top-color:var(--purple);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}

/* 月報按鈕區 */
.monthly-panel{background:var(--purple-l);border:1px solid #DDD6FE;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.monthly-title{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.monthly-sub{font-size:12px;color:#6D28D9;margin-bottom:10px;line-height:1.6}
.monthly-btn{display:flex;align-items:center;gap:7px;padding:9px 16px;border:none;border-radius:var(--radius-s);background:var(--purple);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;width:100%;justify-content:center}
.monthly-btn:active{opacity:.8}
.monthly-btn:disabled{background:#A78BFA;cursor:not-allowed}
.monthly-status{margin-top:8px;font-size:12px;display:none}

/* 專案控管相關（保留原有） */
.wtabs{display:flex;border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden;margin-bottom:10px;background:var(--surface)}
.wt{flex:1;padding:8px 6px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;border-right:1px solid var(--border)}
.wt:last-child{border-right:none}
.wt.on{background:var(--accent);color:#fff}
.wt-sub{font-size:10px;opacity:.7}
.wt-n{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--red-l);color:var(--red);margin-top:1px;min-width:20px;text-align:center}
.wt.on .wt-n{background:rgba(255,255,255,.25);color:#fff}
.proj-sec{margin-bottom:8px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.proj-sec-hdr{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--bg);cursor:pointer;user-select:none;border-bottom:1px solid var(--border)}
.proj-sec-arr{font-size:10px;color:var(--hint);transition:transform .15s;flex-shrink:0}
.proj-sec-arr.op{transform:rotate(90deg)}
.proj-sec-t{font-size:13px;font-weight:700;color:var(--text);flex:1}
.proj-sec-cnt{font-size:11px;color:var(--muted);background:var(--border);border-radius:20px;padding:1px 7px}
.proj-sec-body{display:none;padding:5px 6px 6px}
.proj-sec-body.op{display:block}
.pcard{border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:4px;background:#fff}
.pcard-hdr{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer}
.pcard-title{font-size:13px;font-weight:500;color:var(--text);flex:1}
.pcard-num{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--accent-l);color:var(--accent-t);font-family:monospace}
.pcard-status{font-size:10px;padding:2px 8px;border-radius:20px;flex-shrink:0;font-weight:600}
.nb-prog{background:var(--amber-l);color:var(--amber)}
.nb-done{background:var(--green-l);color:var(--green)}
.nb-stop{background:var(--red-l);color:var(--red)}
.nb-pend{background:var(--blue-l);color:var(--blue)}
.add-opt-row{display:flex;gap:6px;margin-top:5px}
.add-opt-input{flex:1;padding:6px 8px;border:1px solid var(--border-s);border-radius:var(--radius-s);font-family:inherit;font-size:12px;background:var(--bg);color:var(--text);outline:none}
.add-opt-btn{padding:6px 10px;border:1px solid var(--blue);border-radius:var(--radius-s);background:var(--blue-l);color:var(--blue);font-family:inherit;font-size:12px;cursor:pointer;font-weight:500}

.eye-btn{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:16px;
  color:rgba(255,255,255,.5);padding:4px;line-height:1;
  transition:color .15s;
}
.eye-btn:hover{color:rgba(255,255,255,.9);}
.eye-btn-dark{color:var(--muted);}
.eye-btn-dark:hover{color:var(--navy);}
.pwd-wrap{position:relative;display:flex;align-items:center;}
.pwd-wrap input{flex:1;padding-right:36px !important;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
// ── 顯示/隱藏密碼 ──
function togglePwd(inputId, btn){
  const el=document.getElementById(inputId);
  if(!el)return;
  if(el.type==='password'){el.type='text';btn.textContent='🙈';}
  else{el.type='password';btn.textContent='👁';}
}
</script>
</head>
<body>

<div class="header">
  <div class="h-left">
    <div class="h-title">
      <span class="sync-dot" id="syn-dot"></span>
      📋 產品開發需求單取號系統
      <span style="font-size:10px;background:rgba(255,255,255,.2);padding:2px 7px;border-radius:20px;display:flex;align-items:center;gap:4px">
        <span class="ai-dot" id="ai-dot"></span>🐠
      </span>
    </div>
    <div class="h-sub" id="h-sub">台北/宜蘭共用 · 即時同步</div>
  </div>
  <button class="menu-btn" onclick="openMenu()"><span></span><span></span><span></span></button>
</div>

<div class="admin-bar" id="admin-bar">
  <span class="admin-bar-label">⚙️ 管理員後台</span>
  <button class="admin-exit" onclick="exitAdmin()">← 返回取號</button>
</div>

<div class="nav" id="user-nav">
  <button class="nav-btn active" id="nav-new" onclick="switchUserTab('new')">新增取號</button>
  <button class="nav-btn" id="nav-history" onclick="switchUserTab('history')">取號記錄</button>
</div>
<div class="nav" id="admin-nav" style="display:none">
  <button class="nav-btn active" id="nav-adm-proj" onclick="switchAdminTab('adm-proj')">專案控管</button>
  <button class="nav-btn" id="nav-adm-monthly" onclick="switchAdminTab('adm-monthly')">🐠 月報產出</button>
  <button class="nav-btn" id="nav-adm-deleted" onclick="switchAdminTab('adm-deleted')">刪除記錄</button>
  <button class="nav-btn" id="nav-adm-options" onclick="switchAdminTab('adm-options')">選項管理</button>
</div>

<div class="content" id="main-content"></div>

<!-- Menu -->
<div class="menu-overlay" id="menu-overlay" onclick="closeMenuIfOutside(event)">
  <div class="menu-panel" id="menu-panel">
    <div class="menu-header">
      <span class="menu-header-title">⚙️ 系統選單</span>
      <button class="menu-close" onclick="closeMenu()">✕</button>
    </div>
    <div class="menu-body">
      <div class="menu-section">
        <div class="menu-section-title">取號功能</div>
        <button class="menu-item" onclick="menuGoTab('new')">📋 新增取號</button>
        <button class="menu-item" onclick="menuGoTab('history')">📊 取號記錄</button>
      </div>
      <div class="menu-section">
        <div class="menu-section-title">專案管理</div>
        <button class="menu-item" onclick="closeMenu();S.adminOK=true;S.tab='adm-proj';render();scrollTo(0,0)">📊 研發專案控管</button>
        <button class="menu-item" onclick="closeMenu();S.adminOK=true;S.tab='adm-monthly';render();scrollTo(0,0)">🐠 月報自動產出</button>
      </div>
      <div class="menu-section">
        <div class="menu-section-title">管理員</div>
        <button class="menu-item" id="menu-admin-btn" onclick="menuAdminClick()">🔐 進入後台</button>
      </div>
    </div>
  </div>
</div>

<!-- PIN -->
<div class="pin-overlay" id="pin-overlay">
  <div class="pin-box">
    <div style="font-size:24px;margin-bottom:10px">🔐</div>
    <div style="font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">管理員驗證</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:18px">請輸入後台密碼</div>
    <div class="pwd-wrap"><input class="pin-input" type="password" id="pin-input" maxlength="8" placeholder="••••" onkeydown="if(event.key==='Enter')verifyPin()"><button type="button" class="eye-btn eye-btn-dark" onclick="togglePwd('pin-input',this)" title="顯示/隱藏密碼">👁</button></div>
    <div class="pin-err" id="pin-err"></div>
    <div class="pin-row">
      <button class="pin-cancel" onclick="closePin()">取消</button>
      <button class="pin-ok" onclick="verifyPin()">進入</button>
    </div>
  </div>
</div>

<script>
// ── Firebase ──
const FB='https://evaluation-survey-form-default-rtdb.firebaseio.com';
const P_COUNTERS='prod_req/counters';
const P_RECORDS='prod_req/records';
const P_DELETED='prod_req/deleted_records';
const P_OPTIONS='prod_req/options';
const P_PROJ='prod_req/proj_details';
const ADMIN_PIN='Bfy@90632323';

function getRocYear(){return String(new Date().getFullYear()-1911).padStart(3,'0');}
function makeKey(c){return c+getRocYear();}
function curSeq(c){return S.counters[makeKey(c)]||0;}
function nextSeq(c){return curSeq(c)+1;}
function fmtNum(c,yr,seq){return c+yr+String(seq).padStart(3,'0');}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function setSyn(st){
  const d=document.getElementById('syn-dot');
  if(st==='ok')d.className='sync-dot ok';
  else if(st==='sv')d.className='sync-dot';
  else d.className='sync-dot err';
}
function setAI(st,msg=''){
  const dot=document.getElementById('ai-dot');
  const bar=document.getElementById('ai-status-bar');
  const spin=bar?bar.querySelector('.ai-spinner'):null;
  const txt=bar?bar.querySelector('.ai-status-text'):null;
  if(st==='thinking'){
    dot.className='ai-dot thinking';
    if(bar){bar.className='ai-status-bar show';if(spin)spin.style.display='block';if(txt)txt.textContent=msg||'🐠 小福思考中...';}
  }else if(st==='done'){
    dot.className='ai-dot done';
    if(bar){if(spin)spin.style.display='none';if(txt){txt.textContent=msg||'✓ 完成';txt.style.color='var(--green)';}
      setTimeout(()=>{bar.className='ai-status-bar';dot.className='ai-dot';if(txt)txt.style.color='';},4000);}
  }else if(st==='err'){
    dot.className='ai-dot err';
    if(bar){bar.className='ai-status-bar show';if(spin)spin.style.display='none';if(txt){txt.textContent=msg;txt.style.color='var(--red)';}
      setTimeout(()=>{bar.className='ai-status-bar';dot.className='ai-dot';},5000);}
  }else{
    dot.className='ai-dot';
    if(bar)bar.className='ai-status-bar';
  }
}

async function callClaude(system, user, maxTokens=600){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:maxTokens,system,messages:[{role:'user',content:user}]})
  });
  const data=await res.json();
  return (data.content||[]).map(c=>c.text||'').join('');
}

// ── 1. 智能填寫建議 ──────────────────────────────
let suggestTimer=null;
function onNameInput(){
  const name=document.getElementById('inp-name')?.value.trim()||'';
  clearTimeout(suggestTimer);
  hideSuggest();
  if(name.length<4)return;
  // 先查快取
  if(S.aiSuggestCache[name]){
    showSuggest(S.aiSuggestCache[name]);return;
  }
  suggestTimer=setTimeout(()=>runSuggest(name),800);
}

async function runSuggest(name){
  setAI('thinking','🐠 分析品項類別...');
  const system=`你是食品研發專案分類助理。
根據產品名稱，判斷最適合的「項目類別」，從以下選項中選擇：
樣品、餅體、成本試算、新品/成本試算、系統認證、樣品/規格

只回傳 JSON，格式：{"category":"類別名稱","confidence":"high/medium","reason":"一句話原因"}
不要其他文字。`;
  const user=`產品名稱：${name}`;
  try{
    const raw=await callClaude(system,user,150);
    const clean=raw.replace(/```json|```/g,'').trim();
    const result=JSON.parse(clean);
    S.aiSuggestCache[name]=result;
    showSuggest(result);
    setAI('done','🐠 已分析類別');
  }catch(e){
    setAI('err','🐠 分析失敗，請手動選擇');
    console.error('suggest error',e);
  }
}

function showSuggest(result){
  const box=document.getElementById('ai-suggest-box');
  const chips=document.getElementById('ai-suggest-chips');
  if(!box||!chips)return;
  // 主建議 + 相關選項
  const CATS=['樣品','餅體','成本試算','新品/成本試算','系統認證','樣品/規格'];
  const suggestions=[result.category,...CATS.filter(c=>c!==result.category).slice(0,2)];
  chips.innerHTML=suggestions.map(c=>`
    <button class="ai-suggest-chip ${c===result.category?'selected':''}" onclick="applySuggest('${escH(c)}')">
      ${c===result.category?'✓ ':''>${escH(c)}
    </button>`).join('');
  // 修正模板語法
  chips.innerHTML=suggestions.map(c=>`<button class="ai-suggest-chip ${c===result.category?'selected':''}" onclick="applySuggest('${escH(c)}')">${c===result.category?'✓ ':''}${escH(c)}</button>`).join('');
  const hint=box.querySelector('.ai-suggest-hint');
  if(hint)hint.textContent=result.reason||'';
  box.className='ai-suggest-box show';
}

function hideSuggest(){
  const box=document.getElementById('ai-suggest-box');
  if(box)box.className='ai-suggest-box';
}

function applySuggest(cat){
  const sel=document.getElementById('sel-category');
  if(sel){sel.value=cat;sel.dispatchEvent(new Event('change'));}
  // 更新 chip 選中狀態
  document.querySelectorAll('.ai-suggest-chip').forEach(btn=>{
    const isThis=btn.textContent.trim().replace(/^✓ /,'')===cat;
    btn.className='ai-suggest-chip'+(isThis?' selected':'');
    btn.textContent=(isThis?'✓ ':'')+cat;
  });
}

// ── 2. 重複偵測 ──────────────────────────────────
async function checkDuplicate(name, category){
  if(!name||S.records.length===0)return false;
  setAI('thinking','🐠 檢查是否有相似取號...');
  // 本地相似度計算（不需 AI）
  const yr=getRocYear();
  const recentRecords=S.records.filter(r=>r.year===yr).slice(0,50);
  const similar=recentRecords.filter(r=>{
    const n1=name.toLowerCase().replace(/[\s_\-]/g,'');
    const n2=(r.name||'').toLowerCase().replace(/[\s_\-]/g,'');
    if(n1===n2)return true;
    // 包含關係
    if(n1.length>4&&(n1.includes(n2.slice(0,Math.min(n2.length,8)))||n2.includes(n1.slice(0,Math.min(n1.length,8)))))return true;
    return false;
  }).slice(0,3);

  if(similar.length===0){setAI('done','🐠 無重複，可以取號');return false;}

  // 有相似，用 AI 判斷是否真的重複
  const system=`你是品項重複判斷助理。判斷新品項和歷史記錄是否為重複或高度相似。
只回傳 JSON：{"isDuplicate":true/false,"similarity":"high/medium/low","message":"一句話說明"}`;
  const user=`新品項：${name}（類別：${category}）
歷史記錄：${similar.map(r=>`${r.num} - ${r.name}（${r.category}）`).join('\n')}`;
  try{
    const raw=await callClaude(system,user,200);
    const clean=raw.replace(/```json|```/g,'').trim();
    const result=JSON.parse(clean);
    if(result.isDuplicate||result.similarity==='high'){
      S.dupWarning={similar,message:result.message};
      setAI('err','🐠 偵測到相似品項！');
      return true;
    }
    setAI('done','🐠 確認非重複');
    return false;
  }catch(e){
    setAI('done');
    return false;
  }
}

function showDupWarning(){
  const box=document.getElementById('dup-warn-box');
  if(!box||!S.dupWarning)return;
  const items=S.dupWarning.similar.map(r=>`
    <div class="dup-item">
      <span class="dup-num">${escH(r.num)}</span>${escH(r.name)}
      <span class="dup-score">${escH(r.category)}</span>
    </div>`).join('');
  box.innerHTML=`

    <div style="font-size:12px;color:var(--amber);margin-bottom:8px">${escH(S.dupWarning.message||'請確認是否為全新需求')}</div>

      <button class="dup-cancel-btn" onclick="hideDupWarning()">取消</button>
    </div>`;
  box.className='dup-warn-box show';
}

async function generateMonthlyReport(){
  const btn=document.getElementById('monthly-btn');
  const statusEl=document.getElementById('monthly-status');
  if(btn)btn.disabled=true;
  if(statusEl){statusEl.style.display='block';statusEl.style.color='var(--purple)';statusEl.textContent='🐠 小福正在讀取本月數據...';}
  setAI('thinking','🐠 產出月報中...');

  // 讀取最新資料
  const [rawR,rawP]=await Promise.all([fbGet(P_RECORDS),fbGet(P_PROJ)]);
  const records=rawR?Object.values(rawR):S.records;
  const projDetails=rawP||S.projDetails;
  const now=new Date();
  const yr=getRocYear();
  const month=now.getMonth()+1;
  // 本月記錄
  const monthRecords=records.filter(r=>{
    if(r.year!==yr)return false;
    const d=new Date(r.ts||0);
    return d.getMonth()+1===month;
  });
  // 所有當年度專案狀態統計
  const yearRecords=records.filter(r=>r.year===yr);
  const statusCount={};
  const doneStatus=new Set(['已完成','已上市','結案','不執行']);
  yearRecords.forEach(r=>{
    const s=projDetails[r.num]?.status||'進行中';
    statusCount[s]=(statusCount[s]||0)+1;
  });
  const overdueCount=yearRecords.filter(r=>{
    const d=projDetails[r.num];
    if(!d?.launch)return false;
    if(doneStatus.has(d.status||''))return false;
    const parts=d.launch.replace(/-/g,'/').split('/');
    if(parts.length<2)return false;
    const launchDate=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parts[2]?parseInt(parts[2]):1);
    return launchDate<now;
  }).length;

  const system=`你是研發部月報助理，幫助整理產品開發需求單的月度報告。
請根據數據產出一份正式的繁體中文月報摘要，格式如下：
【${parseInt(yr)+1911}年${month}月 研發需求月報】

一、本月取號概況
（說明本月取號筆數、按國別與類別分佈）

二、累計進行中專案
（說明今年累計各狀態數量，特別標注逾期數量）

三、本月重點品項
（列出本月新增的重要品項，不超過5項）

四、注意事項
（如有逾期專案，提醒需跟進）

語氣正式，言簡意賅。直接輸出月報內容，不要其他說明。`;

  const user=`本月新增取號：${monthRecords.length} 筆
國別分佈：${Object.entries(monthRecords.reduce((a,r)=>{a[r.country]=(a[r.country]||0)+1;return a},{})).map(([k,v])=>`${k}: ${v}`).join('、')||'無'}
類別分佈：${Object.entries(monthRecords.reduce((a,r)=>{a[r.category]=(a[r.category]||0)+1;return a},{})).map(([k,v])=>`${k}: ${v}`).join('、')||'無'}

今年累計 ${yearRecords.length} 筆，狀態分佈：
${Object.entries(statusCount).map(([k,v])=>`${k}: ${v}筆`).join('、')}
逾期未完成：${overdueCount} 筆

本月新增品項（前5項）：
${monthRecords.slice(0,5).map(r=>`- ${r.num} ${r.name}（${r.category}，取號人：${r.requester||'—'}）`).join('\n')||'無'}`;

  try{
    const report=await callClaude(system,user,800);
    if(statusEl){statusEl.style.color='var(--green)';statusEl.textContent='✓ 月報產出完成！';}
    setAI('done','🐠 月報完成');
    // 顯示報告
    renderMonthlyResult(report,monthRecords,yearRecords,statusCount,overdueCount,yr,month);
  }catch(e){
    if(statusEl){statusEl.style.color='var(--red)';statusEl.textContent='❌ 產出失敗：'+e.message;}
    setAI('err','🐠 月報失敗');
  }
  if(btn)btn.disabled=false;
}

  const container=document.getElementById('monthly-result');
  if(!container)return;
  const adYear=parseInt(yr)+1911;
  container.innerHTML=`
    <div style="background:var(--surface);border:1px solid #DDD6FE;border-radius:var(--radius);padding:16px;margin-top:12px">

async function downloadMonthlyExcel(yr,month){
  const adYear=parseInt(yr)+1911;
  const [rawR,rawP]=await Promise.all([fbGet(P_RECORDS),fbGet(P_PROJ)]);
  const records=(rawR?Object.values(rawR):S.records).filter(r=>r.year===yr);
  const projDetails=rawP||S.projDetails;
  const wb=XLSX.utils.book_new();
  const headers=['項次','編號','項目','名稱','取號人','期望完成日','負責人','狀態','備註','需求內容'];
  const rows=records.map((r,i)=>{
    const d=projDetails[r.num]||{};
    return[i+1,r.num,r.category,r.name,r.requester||'',d.launch||'',d.owner||'',d.status||'進行中',d.note||'',d.reqContent||r.desc||''];
  });
  const ws=XLSX.utils.aoa_to_sheet([[`${adYear}年${month}月 研發需求月報`,...Array(9).fill('')],headers,...rows]);
  ws['!cols']=[{wch:6},{wch:12},{wch:12},{wch:30},{wch:8},{wch:12},{wch:8},{wch:10},{wch:12},{wch:36}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:9}}];
  XLSX.utils.book_append_sheet(wb,ws,`${adYear}年${month}月月報`);
  XLSX.writeFile(wb,`研發需求月報_${adYear}年${month}月.xlsx`);
}

  const info=document.getElementById('seq-info');
  if(!info)return;
  if(!c){info.style.display='none';return;}
  const cur=curSeq(c);
  document.getElementById('seq-label').textContent=c+yr;

async function submitForm(){

  const requester=document.getElementById('inp-requester').value.trim();

  const duedate=duedateRaw?duedateRaw.replace(/-/g,'/'):'';
  document.getElementById('err-country').style.display=!c?'block':'none';
  document.getElementById('err-category').style.display=!cat?'block':'none';
  document.getElementById('err-name').style.display=!nm?'block':'none';

  document.getElementById('err-duedate').style.display=!duedate?'block':'none';
  document.getElementById('err-desc').style.display=!desc?'block':'none';

  const btn=document.getElementById('submit-btn');
  btn.disabled=true;btn.textContent='🐠 小福驗證中...';

  // 🐠 重複偵測
  const isDup=await checkDuplicate(nm,cat);

async function doSubmit(skipDupCheck){
  const c=document.getElementById('sel-country').value;
  const cat=document.getElementById('sel-category').value;
  const nm=document.getElementById('inp-name').value.trim();
  const requester=document.getElementById('inp-requester').value.trim();
  const desc=document.getElementById('inp-desc').value.trim();
  const duedateRaw=document.getElementById('inp-duedate').value;
  const duedate=duedateRaw?duedateRaw.replace(/-/g,'/'):'';

  const btn=document.getElementById('submit-btn');
  btn.disabled=true;btn.textContent='取號中，請稍候...';
  setSyn('sv');

  const fresh=await fbGet(P_COUNTERS);
  if(fresh)S.counters=fresh;
  const yr=getRocYear();
  const key=makeKey(c);
  const seq=(S.counters[key]||0)+1;
  const num=fmtNum(c,yr,seq);
  S.counters[key]=seq;
  const now=new Date();
  const record={
    num,country:c,year:yr,seq,category:cat,name:nm,requester,desc,
    date:now.toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}),
    time:now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),
    ts:now.getTime()
  };
  const[ok1,ok2]=await Promise.all([fbPatch(P_COUNTERS,{[key]:seq}),fbPost(P_RECORDS,record)]);
  setSyn(ok1&&ok2?'ok':'err');
  S.records.unshift(record);
  S.lastToastNum=num;
  if(!S.projDetails[num])S.projDetails[num]={status:'',owner:'',launch:duedate,progress:'',note:'',reqContent:desc};
  if(duedate||desc)await fbPatch(P_PROJ+'/'+num,{launch:duedate,reqContent:desc});
  renderNew();
  setTimeout(()=>{
    const t=document.getElementById('toast'),tn=document.getElementById('toast-num-text');
    if(t&&tn){tn.textContent=num;t.style.display='block';}
    setTimeout(()=>{const t2=document.getElementById('toast');if(t2)t2.style.display='none';},10000);
  },0);
}

function copyToast(){
  const num=S.lastToastNum;if(!num)return;
  navigator.clipboard.writeText(num).then(()=>{
    const b=document.querySelector('.copy-big-btn');
    if(b){b.textContent='✓ 已複製';setTimeout(()=>b.textContent='複製編號',1500);}
  }).catch(()=>alert('編號：'+num));
}

function cpNum(num,btn){
  navigator.clipboard.writeText(num).then(()=>{btn.textContent='✓';setTimeout(()=>btn.textContent='複製',1500);}).catch(()=>alert('編號：'+num));
}
async function confirmDelete(num){
  const r=S.records.find(rec=>rec.num===num);if(!r){alert('找不到記錄');return;}
  if(!confirm(`確認刪除？\n編號：${r.num}\n名稱：${r.name}`))return;
  const fbKey=S.fbKeyMap[num];
  const deleted={...r,deletedAt:new Date().toISOString(),deletedBy:'user'};
  setSyn('sv');
  const[ok1,ok2]=await Promise.all([fbPost(P_DELETED,deleted),fbKey?fbDelete(P_RECORDS+'/'+fbKey):Promise.resolve(true)]);
  if(ok1&&ok2){
    setSyn('ok');
    const idx=S.records.findIndex(rec=>rec.num===num);
    if(idx>=0){S.records.splice(idx,1);delete S.fbKeyMap[num];}
    renderHistory();
  }else{setSyn('err');alert('刪除失敗');}
}

async function restoreRecord(fbKey){

function renderAdmProj(){

  const STATUS_TC={'進行中':'var(--amber)','已完成':'var(--green)','已上市':'var(--green)','不執行':'var(--red)','暫緩':'var(--red)','尚未開始':'var(--blue)','結案':'var(--muted)'};

            <div class="pcard-hdr">
              <span class="pcard-num">${escH(r.num)}</span>

          </div>`;
        }).join('')}

    </div>`).join('');

function togPS(id){
  const b=document.getElementById('psb-'+id),a=document.getElementById('psa-'+id);
  if(!b)return;const op=b.classList.toggle('op');a.classList.toggle('op',op);
}
async function downloadExcelYear(yr){
  const rawP=await fbGet(P_PROJ);
  if(rawP)S.projDetails={...rawP};
  const adYear=parseInt(yr)+1911;
  const records=S.records.filter(r=>r.year===yr).sort((a,b)=>(a.seq||0)-(b.seq||0));
  if(!records.length){alert(adYear+'年度尚無取號記錄');return;}
  const wb=XLSX.utils.book_new();
  const headers=['項次','編號','項目','名稱','取號人','需求內容','進度說明','期望完成日','負責人','狀態','備註'];
  const rows=records.map((r,i)=>{
    const d=S.projDetails[r.num]||{};
    return[i+1,r.num,r.category,r.name,r.requester||'',d.reqContent||r.desc||'',d.progress||'',d.launch||'',d.owner||'',d.status||'',d.note||''];
  });
  const ws=XLSX.utils.aoa_to_sheet([[`${adYear}年度產品專案控管表`,...Array(10).fill('')],headers,...rows]);
  ws['!cols']=[{wch:6},{wch:12},{wch:12},{wch:30},{wch:8},{wch:36},{wch:40},{wch:10},{wch:8},{wch:10},{wch:12}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:10}}];
  XLSX.utils.book_append_sheet(wb,ws,adYear+'年專案總表');
  const dateStr=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'');
  XLSX.writeFile(wb,'研發專案控管表_'+adYear+'_'+dateStr+'.xlsx');
}

function switchUserTab(tab){S.tab=tab;render();}
function switchAdminTab(tab){S.tab=tab;render();scrollTo(0,0);}

// ── Render ────────────────────────────────────────
function render(){
  const userNav=document.getElementById('user-nav');
  const adminNav=document.getElementById('admin-nav');
  const adminBar=document.getElementById('admin-bar');
  if(S.adminOK){
    userNav.style.display='none';adminNav.style.display='flex';adminBar.classList.add('show');
    ['adm-proj','adm-monthly','adm-deleted','adm-options'].forEach(t=>{
      document.getElementById('nav-'+t)?.classList.toggle('active',S.tab===t);
    });
    if(S.tab==='adm-proj')renderAdmProj();
    else if(S.tab==='adm-monthly')renderAdmMonthly();
    else if(S.tab==='adm-deleted')renderAdmDeleted();
    else if(S.tab==='adm-options')renderAdmOptions();
  }else{
    userNav.style.display='flex';adminNav.style.display='none';adminBar.classList.remove('show');
    ['new','history'].forEach(t=>{document.getElementById('nav-'+t)?.classList.toggle('active',S.tab===t);});
    if(S.tab==='new')renderNew();
    else if(S.tab==='history')renderHistory();
  }
}

// ── Firebase 載入 ─────────────────────────────────
async function loadFirebase(){
  setSyn('sv');
  try{
    const[rawC,rawR,rawO,rawP]=await Promise.all([fbGet(P_COUNTERS),fbGet(P_RECORDS),fbGet(P_OPTIONS),fbGet(P_PROJ)]);
    S.counters=rawC&&typeof rawC==='object'?rawC:{};
    if(rawR&&typeof rawR==='object'){
      S.fbKeyMap={};
      S.records=Object.entries(rawR).map(([k,v])=>{S.fbKeyMap[v.num]=k;return v;}).sort((a,b)=>(b.ts||0)-(a.ts||0));
    }else S.records=[];
    if(rawO){S.options.countries=Array.isArray(rawO.countries)?rawO.countries:[];S.options.categories=Array.isArray(rawO.categories)?rawO.categories:[];}
    S.projDetails=rawP&&typeof rawP==='object'?rawP:{};
    S.fbLoaded=true;setSyn('ok');
  }catch(e){setSyn('err');}
}

// ── Boot ──────────────────────────────────────────
render();
loadFirebase().then(()=>{if(!S.adminOK)render();});
</script>
